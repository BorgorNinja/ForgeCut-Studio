name: Build APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/ForgeCut.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForgeCut-Debug-APK
          path: out/ForgeCut.apk
          retention-days: 14

      - name: Point latest tag to current commit
        if: startsWith(github.ref, 'refs/tags/') != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest ${{ github.sha }}
          git push -f origin latest || true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('ForgeCut Studio {0}', github.ref_name) || 'ForgeCut Studio (Latest Build)' }}
          body: |
            Automated build from commit ${{ github.sha }}
            
            Branch: ${{ github.ref_name }}
          files: out/ForgeCut.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
