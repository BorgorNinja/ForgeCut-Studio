name: Build FFmpeg (one-time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ffmpeg:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y pkg-config make

      - name: Build FFmpeg for Android arm64
        run: bash scripts/build-ffmpeg.sh

      - name: Publish libffmpeg.so
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ffmpeg-android
          name: FFmpeg engine for ForgeCut (arm64-v8a)
          body: Prebuilt FFmpeg CLI (GPL, libx264). The app build downloads this automatically.
          files: out/libffmpeg.so
          prerelease: true
          make_latest: false
